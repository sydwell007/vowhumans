services:
  # Issues session records and signed LiveKit room tokens for the Next.js app.
  # Stateless HTTP service — the free web tier is fine for this.
  - type: web
    name: vowhumans-api-gateway
    runtime: python
    rootDir: services/api-gateway
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # Render defaults to the newest Python (3.14 as of writing), which is too new for
      # pydantic-core's prebuilt wheels — pip falls back to a source build via maturin
      # and fails. Pin to a version with known-good prebuilt wheels.
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: VOWHUMANS_ALLOWED_ORIGIN
        value: https://vowhumans.com
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Must be the exact same value already set as VOWHUMANS_SERVICE_API_KEY in Vercel.
      - key: VOWHUMANS_SERVICE_API_KEY
        sync: false
      # Must match studio-web's server-only Vercel value exactly. It signs
      # short-lived public embed credentials and is never sent to the browser.
      - key: VOWHUMANS_EMBED_TOKEN_SECRET
        sync: false
      # Gates whether tokens attach a RoomAgentDispatch for vowhumans-avatar-participant
      # at all — leave unset/false until that worker (below) is deployed and healthy,
      # so a half-configured avatar pipeline can't affect the working voice-only call.
      - key: ENABLE_AVATAR_PARTICIPANT
        value: "true"

  # The actual voice AI: stays connected to LiveKit and joins a room whenever a
  # session is created. Must run continuously — needs a paid worker plan, not free.
  # Starter's 512MB RAM is not enough: livekit-agents + the openai plugin + av +
  # inference warmup routinely exceed it, crashing the worker every few minutes
  # (confirmed via repeated "Ran out of memory (used over 512MB)" events on Render).
  - type: worker
    name: vowhumans-realtime-agent
    runtime: python
    rootDir: services/realtime-agent
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: python livekit_agent.py start
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: ENABLE_OPENAI_REALTIME
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: STUDIO_WEB_URL
        sync: false
      - key: VOWHUMANS_INTERNAL_KEY
        sync: false
      # The opening reply waits briefly for synchronized avatar tracks. If face
      # preparation fails, the existing voice-only path continues after this bound.
      - key: AVATAR_READY_WAIT_SECONDS
        value: "15"

  # Joins the same room as vowhumans-realtime-agent (via explicit LiveKit agent
  # dispatch — see services/api-gateway's RoomAgentDispatch), renders lip-synced
  # video through the RunPod-hosted avatar-worker, and publishes it back. Separate
  # process for the same reason realtime-agent needed the plan bump above: adding
  # OpenCV/frame buffers/an HTTP client to that already memory-tight worker would
  # risk the same crash taking the working voice path down with it.
  - type: worker
    name: vowhumans-avatar-participant
    runtime: python
    rootDir: services/avatar-participant
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: python livekit_agent.py start
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # RunPod GPU pod proxy URL — changes every time the pod is deleted and
      # redeployed fresh (not on Stop/Start), so this needs a manual update after
      # each redeploy until/unless the pod gets a stable ingress in front of it.
      - key: AVATAR_WORKER_URL
        sync: false
      - key: STUDIO_WEB_URL
        sync: false
      # Must be the exact same value already set as VOWHUMANS_INTERNAL_KEY on
      # avatar-worker (RunPod) and in Vercel (studio-web).
      - key: VOWHUMANS_INTERNAL_KEY
        sync: false
      # Live RunPod measurements are roughly 5-6 seconds for a warm two-second
      # clip, so normal sentence-length renders need more than the old 8 seconds.
      - key: AVATAR_RENDER_TIMEOUT_SECONDS
        value: "45"
      - key: AVATAR_SILENCE_HOLD_SECONDS
        value: "1.5"
      - key: AVATAR_TURN_DRAIN_SECONDS
        value: "0.25"
