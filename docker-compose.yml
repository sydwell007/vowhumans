name: vowhumans
services:
  postgres:
    # pgvector's own image, not plain postgres — 007_knowledge_personas_library.sql
    # needs the vector extension, which plain postgres:17-alpine doesn't ship.
    # Existing local volumes predate this and won't have it: `docker compose down -v`
    # before bringing this up fresh.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: vowhumans
      POSTGRES_USER: vowhumans
      POSTGRES_PASSWORD: vowhumans
    # VowRewards already uses host port 5432 on the shared development machine.
    # Containers still reach this database on postgres:5432.
    ports: ["5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vowhumans"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: change-me-now
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  livekit:
    image: livekit/livekit-server:v1.8.4
    command: --dev --bind 0.0.0.0
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.python
      args: { SERVICE_PATH: services/api-gateway }
    environment:
      DATABASE_URL: postgresql://vowhumans:vowhumans@postgres:5432/vowhumans
      REDIS_URL: redis://redis:6379/0
      VOWHUMANS_SERVICE_API_KEY: dev-only-change-me
      VOWHUMANS_EMBED_TOKEN_SECRET: ${VOWHUMANS_EMBED_TOKEN_SECRET:-dev-only-embed-token-secret-change-me}
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      ENABLE_AVATAR_PARTICIPANT: "true"
    ports: ["8000:8000"]
    depends_on: [postgres, redis, minio]

  realtime-agent:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.python
      args: { SERVICE_PATH: services/realtime-agent }
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
      LIVEKIT_URL: ws://livekit:7880
      ENABLE_OPENAI_REALTIME: "false"
    depends_on: [api-gateway, livekit]

  realtime-agent-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.python
      args: { SERVICE_PATH: services/realtime-agent }
    command: ["python", "/app/service/livekit_agent.py", "dev"]
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      ENABLE_OPENAI_REALTIME: "true"
    depends_on: [livekit]

  mock-avatar-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.python
      args: { SERVICE_PATH: services/avatar-worker }
    environment:
      AVATAR_MODE: mock
      ENABLE_MUSETALK: "false"
    ports: ["8010:8000"]

  # Always talks to the local mock-avatar-worker (ENABLE_MUSETALK=false, so every
  # prepare/render call fails and this exercises the audio-only fallback path) —
  # validates room dispatch and track publish/subscribe cheaply, before ever
  # touching the real GPU pod. See services/avatar-participant's own module
  # docstring for what's confidently correct vs. still needs live verification.
  avatar-participant:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.python
      args: { SERVICE_PATH: services/avatar-participant }
    environment:
      AVATAR_WORKER_URL: http://mock-avatar-worker:8000
      STUDIO_WEB_URL: http://studio-web:3000
      VOWHUMANS_INTERNAL_KEY: dev-only-change-me
      ENABLE_AVATAR_PARTICIPANT: "true"
    depends_on: [mock-avatar-worker, studio-web]

  avatar-participant-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.python
      args: { SERVICE_PATH: services/avatar-participant }
    command: ["python", "/app/service/livekit_agent.py", "dev"]
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      AVATAR_WORKER_URL: http://mock-avatar-worker:8000
      STUDIO_WEB_URL: http://studio-web:3000
      VOWHUMANS_INTERNAL_KEY: dev-only-change-me
      ENABLE_AVATAR_PARTICIPANT: "true"
    depends_on: [livekit, mock-avatar-worker, studio-web]

  studio-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.studio
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
      API_GATEWAY_URL: http://api-gateway:8000
      VOWHUMANS_INTERNAL_KEY: dev-only-change-me
      VOWHUMANS_EMBED_TOKEN_SECRET: ${VOWHUMANS_EMBED_TOKEN_SECRET:-dev-only-embed-token-secret-change-me}
    ports: ["3000:3000"]
    depends_on: [api-gateway]

volumes:
  postgres-data:
  redis-data:
  minio-data:
